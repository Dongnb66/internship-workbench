<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!-- 另一种常见形状：`<title>` 是「{公司}招聘 - {岗位}」，公司段在前。
         这一页钉住反向：拆段之后不能把公司名当成岗位标题。 -->
    <title>星野科技招聘 - 大模型算法实习生</title>
  </head>
  <body>
    <div class="wrap">
      <div class="head">工作地点：上海 · 薪资 300-450元/天 · 每周 5 天</div>
      <div class="duty">
        岗位职责：负责大模型评测与数据合成，搭建检索增强链路，跟进线上效果；
        任职要求：计算机相关专业在读，熟悉 Python，了解常见训练与推理框架。
      </div>
    </div>

    <script src="../collector.js"></script>
    <script>
      const out = document.createElement('pre')
      out.id = 'iwb-out'
      try {
        const r = window.__iwbCollectJobs()
        out.textContent = 'COUNT=' + r.count + '\n' + JSON.stringify(r.jobs, null, 1)
      } catch (e) {
        out.textContent = 'ERROR ' + e.message
      }
      document.body.appendChild(out)
    </script>
  </body>
</html>
