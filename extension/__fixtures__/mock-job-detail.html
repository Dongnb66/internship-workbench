<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>AI Agent 应用开发实习生 - 示例·星野智能科技 - 招聘详情</title>
  </head>
  <body>
    <!--
      详情页夹具：只有一个岗位。用来验证 collector.js 的兜底分支 ——
      卡片检测会因为「少于 4 个」而失效，此时应当退化成「整页 = 1 个岗位」，
      并从 <title> 里取公司名、从 h1 所在容器 + 正文里取城市与薪资。
    -->
    <header>导航 首页 职位 我的</header>
    <h1>AI Agent 应用开发实习生</h1>
    <div class="salary">200-300元/天</div>
    <div class="city">广州·天河区</div>
    <main>
      岗位职责
      1. 参与多智能体应用的设计与开发，基于 LangGraph 编排工具调用与多轮对话流程；
      2. 负责 RAG 检索链路的实现与调优，包括文档切分、混合召回、重排与答案引用；
      3. 编写接口与单元测试，配合后端完成服务化部署。
      任职要求
      1. 本科及以上在读，计算机相关专业，每周到岗 4 天以上；
      2. 熟悉 Python，掌握 FastAPI 或同类框架；
      3. 了解 LLM 应用的常见范式，有实际项目经验优先。
    </main>
    <footer>相关推荐 猜你喜欢 广告</footer>

    <script src="../collector.js"></script>
    <script>
      const out = document.createElement('pre')
      out.id = 'iwb-out'
      try {
        const r = window.__iwbCollectJobs()
        const asText = location.search.includes('format=text')
        out.textContent = asText
          ? r.text
          : 'COUNT=' + r.count + '\n' + JSON.stringify(r.jobs, null, 1)
      } catch (e) {
        out.textContent = 'ERROR ' + e.message
      }
      document.body.appendChild(out)
    </script>
  </body>
</html>
