<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!-- 实习僧详情页的真实形状：页面里没有 <h1>，岗位名与公司名只存在于 <title> 里，
         格式是「{岗位}实习招聘-{公司}实习生招聘-{平台}」。 -->
    <title>Agent策略实习生实习招聘-百度实习生招聘-实习僧</title>
  </head>
  <body>
    <div class="site-nav">首页 校招 实习僧TV 职位百科 企业入口 登录/注册</div>
    <div class="banner">2026-09-23 17:44:05 刷新 · 250-400元/天 北京 本科 4天/周 实习3个月</div>
    <div class="inn_detail">
      <div class="job-section">
        <h2>职位描述：</h2>
        <p>参与 AI Agent 的策略设计、实验与迭代，覆盖任务理解、规划拆解、工具调用、记忆管理、多轮交互；</p>
        <p>协助优化 Prompt、规则策略、工作流编排与上下文管理，基于 LangGraph 落地可复现的评测链路。</p>
      </div>
      <div class="job-section">
        <h2>任职要求：</h2>
        <p>本科及以上在读，计算机相关专业，每周到岗 4 天以上，实习 3 个月以上，有开源项目优先。</p>
      </div>
    </div>
    <div class="side-recommend">相关推荐 猜你在找 广告位</div>

    <script src="../collector.js"></script>
    <script>
      const out = document.createElement('pre')
      out.id = 'iwb-out'
      try {
        const r = window.__iwbCollectJobs()
        out.textContent = 'COUNT=' + r.count + '\n' + JSON.stringify(r.jobs, null, 1)
      } catch (e) {
        out.textContent = 'ERROR ' + e.message
      }
      document.body.appendChild(out)
    </script>
  </body>
</html>
