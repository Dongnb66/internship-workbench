name: CI

on:
  push:
    # 本仓库远端只有 master，原先只写 main ⇒ push 永远不触发，四道门一次都没在 CI 上跑过，
    # 而且症状是静默的（Actions 页面不会红，只会一直空着）。两个名字都列上，理由见
    # src/lib/__tests__/ciTrigger.test.mjs。
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Typecheck (tsc -b)
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm run test

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
          if-no-files-found: error
