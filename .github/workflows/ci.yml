name: CI

on:
  push:
    # 本仓库远端只有 master，原先只写 main ⇒ push 永远不触发，四道门一次都没在 CI 上跑过，
    # 而且症状是静默的（Actions 页面不会红，只会一直空着）。两个名字都列上，理由见
    # src/lib/__tests__/ciTrigger.test.mjs。
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Typecheck (tsc -b)
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm run test

      # 时区守卫：上面那条在 ubuntu-latest 上跑的是 UTC。本项目两次踩到的日期偏差都只在
      # 特定时区现形 —— 「Web ↔ 小程序 daysLeft 差一天」在 UTC+8 会被 8 小时偏移抵消成假绿
      # （本机 `.zsh`/`.bash` 默认正是 UTC+8，716 条全绿），UTC 才暴露；而「纯日期串按 UTC
      # 解释」那类相反，只在整个西半球出错。同一组断言换两个时区再跑一遍，代价几秒，
      # 挡的是「本机全绿、用户那边差一天」这种永远不报错的错。断言本身在
      # src/lib/__tests__/ciTrigger.test.mjs 里钉住（删掉这一步会红）。
      - name: Unit tests (Vitest)，换非 UTC 时区再跑一遍
        run: |
          TZ=America/New_York npm run test
          TZ=Asia/Shanghai npm run test

      # 徽章新鲜度门：README 的 `tests-N passed` 必须等于真实用例数。
      # 2026-10-05 实测到的漂移是 779 vs 900（差 121 条）—— 手写的数字没有任何东西盯着，
      # 而它是对外声称（会被写进简历/作品集），所以这里必须机器把关。
      # 断言本身在 src/lib/__tests__/ciTrigger.test.mjs 里钉住（删掉这一步会红）。
      - name: Tests badge freshness (README 的 tests-N 必须等于实测)
        run: npm run test:badge:check

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
          if-no-files-found: error
