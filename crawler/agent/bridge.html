<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>实习工作台 · 本地助手（桥接中）</title>
    <style>
      body { font: 14px/1.6 "Microsoft YaHei UI", system-ui, sans-serif; margin: 0; padding: 18px; color: #111; background: #fff; }
      h1 { font-size: 15px; margin: 0 0 8px; }
      p { margin: 0 0 6px; color: #444; }
      .ok { color: #0a7f3f; font-weight: 600; }
      .bad { color: #b42318; font-weight: 600; }
      .tip { color: #888; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>本地助手 ↔ 实习工作台</h1>
    <p id="status">正在与工作台建立桥接…</p>
    <p class="tip">这个窗口是工作台与本机助手之间的通道。<strong>抓取时请留着它</strong>（最小化可以）；关掉工作台页面它也会自己关闭。</p>
    <!--
      桥接逻辑由服务端**原地注入**（经典脚本，不用 <script type="module"> / import）。
      2026-10-04 实测：上一版用模块加载，在 Edge 里页面停在「正在与工作台建立桥接…」——
      那段脚本没执行，而「脚本没跑」与「连不上」在界面上长得一模一样，最难查。
      现在：内联经典脚本 + try/catch + 出错直接写进页面、并把错误回传给工作台。
    -->
    <script>
/*__BRIDGE_JS__*/
    </script>
    <script>
      (function () {
        var q = new URLSearchParams(location.search)
        var nonce = q.get('nonce') || ''
        var openerOrigin = q.get('origin') || ''
        var status = document.getElementById('status')
        function tell(msg) {
          try { if (window.opener) window.opener.postMessage(msg, openerOrigin) } catch (e) {}
        }
        function fail(where, e) {
          var text = (e && e.message) || String(e)
          status.className = 'bad'
          status.textContent = '桥接出错（' + where + '）：' + text
          tell({ type: 'iw-bridge-error', nonce: nonce, where: where, message: text })
        }
        try {
          if (typeof createBridge !== 'function') { fail('装载', new Error('桥接脚本没注入成功')); return }
          var bridge = createBridge({
            openerOrigin: openerOrigin,
            nonce: nonce,
            postToOpener: function (m) { tell(m) },
            fetchImpl: function (p, init) { return fetch(p, init) },
          })
          window.addEventListener('message', function (ev) { bridge.onMessage(ev) })
          status.className = 'ok'
          status.textContent = '已连上工作台 ✓'
          window.setInterval(function () {
            if (window.opener && window.opener.closed) window.close()
          }, 2000)
        } catch (e) {
          fail('初始化', e)
        }
      })()
    </script>
  </body>
</html>
